[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verifai"
version = "0.1.0"
description = "Values that carry their own evidence: provenance, verification status and freshness for any fact your code relies on. Built on pydantic."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Zion O'JUWONLO" }]
dependencies = ["pydantic>=2"]
keywords = ["provenance", "pydantic", "data-quality", "llm", "grounding"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["verifai*"]
